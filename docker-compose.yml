# Docker Compose deployment for the ReadRight API.
# The API listens on API_PORT (default 8000). Put a managed HTTPS proxy in front
# of it before exposing this port publicly.
#
# Setup:
#   1. cp .env.example .env and fill in the required backend settings.
#   2. docker compose pull && docker compose up -d

services:
  api:
    image: ${IMAGE:-ghcr.io/christiannemeno/readright-api:latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

