AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  ReadRight learner API and asynchronous analysis infrastructure — keeps video
  uploads private and outside the API Lambda.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    arch: API Gateway -> FastAPI Lambda -> Supabase; browser -> private S3 -> async analysis; EventBridge -> timeout sweep
    must:
      - Learner routes verify Supabase Bearer tokens and scope every session query to that user.
      - Keep media private; only presigned browser requests and the backend/AI roles access objects.
      - Processing timeout must not fail a session after any completed or partial analysis exists.
    ref:
      - at: docs/media-storage.md
        has: bucket prefixes, lifecycle, access and audio retention
        scope: media storage
      - at: docs/lambda-deployment.md
        has: stack region, parameters and scheduled timeout sweep
        scope: deployment

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL
  SupabaseServiceKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key
  BackendApiKey:
    Type: String
    NoEcho: true
    Description: Key required by trusted-backend CRUD routes
  MaiBaseUrl:
    Type: String
    Default: https://readright-mai.reevsan.dev/v1
    Description: MAI service base URL (including /v1)
  MaiApiKey:
    Type: String
    NoEcho: true
    Description: X-API-Key credential for the MAI service
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Browser origin allowed to call the API
  AiAnalysisUrl:
    Type: String
    Default: ''
    Description: Base URL of the asynchronous reading analysis service
  PipelineVersion:
    Type: String
    Default: readright-v1
    Description: Version identifier sent to the analysis service
  ScoringPolicyVersion:
    Type: String
    Default: phil-iri-v1
    Description: Version identifier for reading and comprehension scoring
  AssignmentPolicyVersion:
    Type: String
    Default: passage-assignment-v1
    Description: Version identifier for passage assignment
  ProcessingTimeoutMinutes:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Age after which a processing session is marked failed
  MaxUploadBytes:
    Type: Number
    Default: 157286400
    MinValue: 1
    Description: Maximum size of an uploaded learner video

Resources:
  ReadRightMediaBucket:
    Type: AWS::S3::Bucket
    Metadata:
      com.aws.cloudformation.Context:
        why: direct-to-S3 video keeps large uploads out of Lambda; same-Region bucket reduces the learner upload path; versioning stays off so DeleteObject removes analyzed videos
        must:
          - Keep all four public-access blocks enabled; browsers use presigned POSTs.
          - Keep the 30-day expiration scoped to recordings/; audio/ has no retention rule until the team sets one.
          - Keep bucket encryption enabled and media access private.
        mutable: change-with-constraints
        mutability:
          VersioningConfiguration: must-never-change
        trust: { src: authored, conf: high }
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref AllowedOrigin
              - http://localhost:5173
            AllowedMethods:
              - POST
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-leftover-videos
            Status: Enabled
            Prefix: recordings/
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ReadRightMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: rejects cleartext S3 access; presigned browser and AI requests use HTTPS
        must:
          - Keep the aws:SecureTransport deny for the bucket and all objects.
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      Bucket: !Ref ReadRightMediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ReadRightMediaBucket.Arn
              - !Sub '${ReadRightMediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  MaiDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 3600
      SqsManagedSseEnabled: true

  MaiQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 900
      MessageRetentionPeriod: 3600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MaiDeadLetterQueue.Arn
        maxReceiveCount: 3

  ReadRightApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ReadRightFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: learner API signs upload and analysis links; Lambda handles metadata while media bytes travel directly between browser and S3
        must:
          - Limit S3 access to recordings/; AI role alone manages video deletion and audio writes.
          - Never expose Supabase, backend or AWS credentials to browser code.
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      CodeUri: .
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt MaiQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub '${ReadRightMediaBucket.Arn}/recordings/*'
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          BACKEND_API_KEY: !Ref BackendApiKey
          MAI_QUEUE_URL: !Ref MaiQueue
          MEDIA_BUCKET_NAME: !Ref ReadRightMediaBucket
          MEDIA_BUCKET_REGION: !Ref AWS::Region
          AI_ANALYSIS_URL: !Ref AiAnalysisUrl
          PIPELINE_VERSION: !Ref PipelineVersion
          SCORING_POLICY_VERSION: !Ref ScoringPolicyVersion
          ASSIGNMENT_POLICY_VERSION: !Ref AssignmentPolicyVersion
          PROCESSING_TIMEOUT_MINUTES: !Ref ProcessingTimeoutMinutes
          MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
          ALLOWED_ORIGINS: !Sub '["${AllowedOrigin}"]'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadRightApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadRightApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

  SessionTimeoutFunction:
    Type: AWS::Serverless::Function
    Metadata:
      com.aws.cloudformation.Context:
        why: periodic recovery path marks abandoned analysis sessions failed after backend or AI crashes
        must:
          - Use processing_started_at as the clock, not the learner's reading start time.
          - Preserve sessions with completed or partial analysis rows.
        mutable: change-with-constraints
        trust: { src: authored, conf: high }
    Properties:
      CodeUri: .
      Handler: app.features.me.maintenance.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          PROCESSING_TIMEOUT_MINUTES: !Ref ProcessingTimeoutMinutes
      Events:
        SessionTimeoutSweep:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            State: ENABLED

  MaiWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.features.mai.worker.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 150
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:ChangeMessageVisibility
              Resource: !GetAtt MaiQueue.Arn
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          MAI_BASE_URL: !Ref MaiBaseUrl
          MAI_API_KEY: !Ref MaiApiKey
          MAI_QUEUE_URL: !Ref MaiQueue
          MAI_CONNECT_TIMEOUT_SECONDS: '5'
          MAI_READ_TIMEOUT_SECONDS: '125'
          MAI_SERVICE_NAME: readright-mai
      Events:
        MaiQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt MaiQueue.Arn
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5

Outputs:
  MediaBucketName:
    Description: Private bucket for learner video uploads and derived audio
    Value: !Ref ReadRightMediaBucket
  ApiUrl:
    Description: Public API Gateway URL
    Value: !Sub 'https://${ReadRightApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionArn:
    Description: ReadRight Lambda function ARN
    Value: !GetAtt ReadRightFunction.Arn
