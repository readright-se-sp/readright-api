AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ReadRight FastAPI backend on AWS Lambda and API Gateway HTTP API

Parameters:
  SupabaseUrl:
    Type: String
    Description: Supabase project URL
  SupabaseServiceKey:
    Type: String
    NoEcho: true
    Description: Supabase service role key
  BackendApiKey:
    Type: String
    NoEcho: true
    Description: Key required by trusted-backend CRUD routes
  MaiBaseUrl:
    Type: String
    Default: https://readright-mai.reevsan.dev/v1
    Description: MAI service base URL (including /v1)
  MaiApiKey:
    Type: String
    NoEcho: true
    Description: X-API-Key credential for the MAI service
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Browser origin allowed to call the API

Resources:
  ReadRightApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  ReadRightFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler.handler
      Runtime: python3.12
      Architectures:
        - x86_64
      MemorySize: 512
      Timeout: 150
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Environment:
        Variables:
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_KEY: !Ref SupabaseServiceKey
          BACKEND_API_KEY: !Ref BackendApiKey
          MAI_BASE_URL: !Ref MaiBaseUrl
          MAI_API_KEY: !Ref MaiApiKey
          MAI_CONNECT_TIMEOUT_SECONDS: '5'
          MAI_READ_TIMEOUT_SECONDS: '125'
          ALLOWED_ORIGINS: !Sub '["${AllowedOrigin}"]'
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadRightApi
            Path: /
            Method: ANY
            PayloadFormatVersion: '2.0'
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadRightApi
            Path: /{proxy+}
            Method: ANY
            PayloadFormatVersion: '2.0'

Outputs:
  ApiUrl:
    Description: Public API Gateway URL
    Value: !Sub 'https://${ReadRightApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  FunctionArn:
    Description: ReadRight Lambda function ARN
    Value: !GetAtt ReadRightFunction.Arn
  SynchronousApiUrl:
    Description: Lambda Function URL for requests that can exceed API Gateway's 30-second limit
    Value: !GetAtt ReadRightFunctionUrl.FunctionUrl
